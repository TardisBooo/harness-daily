[package]
name = "harness-daily"
version = "0.1.0"
edition = "2021"
description = "Universal plugin for Grok / Claude / Codex: scan local AI coding harness sessions and write a daily report via the current agent CLI."
license = "MIT"
repository = "https://github.com/TardisBooo/harness-daily"
readme = "README.md"

[[bin]]
name = "harness-daily"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dunce = "1"
glob = "0.3"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
urlencoding = "2"
which = "7"

[dev-dependencies]
tempfile = "3"
